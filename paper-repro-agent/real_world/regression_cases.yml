cases:
  - id: energy-efficiency
    paper:
      url: https://upcommons.upc.edu/server/api/core/bitstreams/c607c005-f9ae-4fc8-b479-15488ee31b48/content
      sha256: sha256:85621f370eb165f419d1e3831311f415dd591ae7873f124e4f083a9543173029
      media_type: application/pdf
      max_bytes: 20000000
      attribution: Angela Nebot and Francisco Mugica, Energy Performance Forecasting of Residential Buildings Using Fuzzy Approaches
      rights: UPC institutional repository terms
    dataset:
      url: https://archive.ics.uci.edu/static/public/242/energy+efficiency.zip
      sha256: sha256:499441eee27929a4b00417f58fd8c63c9cc14b8a71520cd0dd27fcb626738351
      media_type: application/zip
      max_bytes: 50000000
      attribution: UCI Machine Learning Repository, Energy Efficiency dataset by Athanasios Tsanas and Angeliki Xifara
      rights: CC BY 4.0
    transform:
      member: ENB2012_data.xlsx
      format: xlsx
      sheet_name: "Φύλλο1"
      rename_columns:
        X1: relative_compactness
        X2: surface_area
        X3: wall_area
        X4: roof_area
        X5: overall_height
        X6: orientation
        X7: glazing_area
        X8: glazing_area_distribution
        Y1: heating_load
        Y2: cooling_load
      drop_columns: [cooling_load]
    target_column: heating_load
    task_type: regression
    paper_metric_overrides: []

  - id: concrete-strength
    paper:
      url: https://mdpi-res.com/d_attachment/infrastructures/infrastructures-10-00026/article_deploy/infrastructures-10-00026-v2.pdf
      sha256: sha256:15726c9d5d24f5bf7cb2efe216d88ebd830f71fcb79f5d3a165f625c987c4209
      media_type: application/pdf
      max_bytes: 20000000
      attribution: Mohammad Saleh Nikoopayan Tak, Yanxiao Feng, and Mohamed Mahgoub, Advanced Machine Learning Techniques for Predicting Concrete Compressive Strength
      rights: CC BY 4.0
    dataset:
      url: https://archive.ics.uci.edu/static/public/165/concrete+compressive+strength.zip
      sha256: sha256:dad85d14de8aee4e07479daa774e6b569a313715b71a3b92c95a07cf91c2c9a7
      media_type: application/zip
      max_bytes: 50000000
      attribution: UCI Machine Learning Repository, Concrete Compressive Strength dataset by I-Cheng Yeh
      rights: CC BY 4.0
    transform:
      member: Concrete_Data.xls
      format: xls
      sheet_name: Sheet1
      rename_columns:
        "Cement (component 1)(kg in a m^3 mixture)": cement
        "Blast Furnace Slag (component 2)(kg in a m^3 mixture)": blast_furnace_slag
        "Fly Ash (component 3)(kg in a m^3 mixture)": fly_ash
        "Water  (component 4)(kg in a m^3 mixture)": water
        "Superplasticizer (component 5)(kg in a m^3 mixture)": superplasticizer
        "Coarse Aggregate  (component 6)(kg in a m^3 mixture)": coarse_aggregate
        "Fine Aggregate (component 7)(kg in a m^3 mixture)": fine_aggregate
        "Age (day)": age
        "Concrete compressive strength(MPa, megapascals)": concrete_compressive_strength
      drop_columns: []
    target_column: concrete_compressive_strength
    task_type: regression
    paper_metric_overrides: []

  - id: wine-quality-red
    paper:
      url: https://mdpi-res.com/d_attachment/applsci/applsci-11-09885/article_deploy/applsci-11-09885-v2.pdf
