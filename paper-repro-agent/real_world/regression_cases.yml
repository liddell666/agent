  - id: real-estate-valuation
    paper:
      url: https://mdpi-res.com/d_attachment/mathematics/mathematics-09-00686/article_deploy/mathematics-09-00686-v2.pdf
      sha256: sha256:6744114a837a76686a1ec3233f76d3b6cabe4c746fb4c73af0a2b9386b66a355
