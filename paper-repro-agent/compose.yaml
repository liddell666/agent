services:
  paper-parser:
    container_name: paper-parser
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "paper_parser.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes:
      - ./src:/app/src:ro
      - ./data/jobs:/data/jobs
      - parser-model-cache:/home/app/.cache
    networks:
      dify:
        aliases: [paper-parser]
    mem_limit: 4g
    cpus: 4
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  repro-runner:
    container_name: repro-runner
    build:
      context: .
      dockerfile: Dockerfile.repro
    restart: unless-stopped
    env_file: .env
    environment:
      REPRO_RUNNER_STORAGE_DIR: /data/experiments
      REPRO_RUNNER_MAX_CONCURRENT_EXPERIMENTS: "1"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./src:/app/src:ro
      - ./data/experiments:/data/experiments
    networks:
      dify:
        aliases: [repro-runner]
    init: true
    mem_limit: 4g
    cpus: 4
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  dify:
    external: true
    name: docker_default

volumes:
  parser-model-cache:
