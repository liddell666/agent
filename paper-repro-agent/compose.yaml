services:
  paper-parser:
    container_name: paper-parser
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "paper_parser.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes:
      - ./src:/app/src:ro
      - ./data/jobs:/data/jobs
      - parser-model-cache:/home/app/.cache
    networks:
      dify:
        aliases: [paper-parser]
    mem_limit: 4g
    cpus: 4
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  dify:
    external: true
    name: docker_default

volumes:
  parser-model-cache:
