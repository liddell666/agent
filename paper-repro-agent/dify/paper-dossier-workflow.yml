    - data:
        code: "\"\"\"Validate dossier citations and build a deterministic Markdown\
          \ summary.\"\"\"\n\nimport json\nfrom typing import Any\n\n\ndef _evidence_pages(items:\
          \ Any) -> str:\n    if not isinstance(items, list):\n        return \"\"\
          \n    pages = sorted(\n        {\n            item.get(\"page\")\n     \
          \       for item in items\n            if isinstance(item, dict)\n     \
          \       and isinstance(item.get(\"page\"), int)\n            and not isinstance(item.get(\"\
          page\"), bool)\n        }\n    )\n    return \" \".join(f\"[p.{page}]\"\
          \ for page in pages)\n\n\ndef _summary(dossier: dict[str, Any]) -> str:\n\
          \    lines = [f\"# {dossier.get('title') or '未命名论文'}\", \"\"]\n    lines.extend(\n\
          \        [\n            \"## 研究任务\",\n            str(dossier.get(\"research_problem\"\
          ) or \"未提取\"),\n            f\"- 任务类型：{dossier.get('task_type') or 'uncertain'}\"\
          ,\n            \"\",\n            \"## 数据集\",\n        ]\n    )\n    datasets\
          \ = dossier.get(\"datasets\") or []\n    lines.extend(\n        f\"- {item.get('name',\
          \ '未命名')}：{item.get('description', '')} {_evidence_pages(item.get('evidence'))}\"\
          .rstrip()\n        for item in datasets\n        if isinstance(item, dict)\n\
          \    )\n    if not datasets:\n        lines.append(\"- 未提取到有证据的数据集\")\n\n\
          \    lines.extend([\"\", \"## 方法\"])\n    methods = dossier.get(\"methods\"\
          ) or []\n    lines.extend(\n        f\"- {item.get('name', '未命名')}：{item.get('description',\
          \ '')} {_evidence_pages(item.get('evidence'))}\".rstrip()\n        for item\
          \ in methods\n        if isinstance(item, dict)\n    )\n    if not methods:\n\
          \        lines.append(\"- 未提取到有证据的方法\")\n\n    lines.extend([\"\", \"##\
          \ 报告指标\"])\n    metrics = dossier.get(\"metrics\") or []\n    for item in\
          \ metrics:\n        if not isinstance(item, dict):\n            continue\n\
          \        qualifiers = \" / \".join(\n            str(value) for value in\
          \ (item.get(\"dataset\"), item.get(\"split\")) if value\n        )\n   \
          \     qualifier_text = f\"（{qualifiers}）\" if qualifiers else \"\"\n   \
          \     lines.append(\n            f\"- {item.get('name', '未命名')}{qualifier_text}：{item.get('reported_value')}\
          \ \"\n            f\"{_evidence_pages(item.get('evidence'))}\".rstrip()\n\
          \        )\n    if not metrics:\n        lines.append(\"- 未提取到报告指标\")\n\n\
          \    lines.extend([\"\", \"## 复现缺口\"])\n    gaps = dossier.get(\"gaps\"\
          ) or []\n    lines.extend(f\"- {gap}\" for gap in gaps)\n    if not gaps:\n\
          \        lines.append(\"- 未发现明确缺口\")\n    return \"\\n\".join(lines)\n\n\
          \ndef main(dossier_json: Any, page_count: Any) -> dict[str, Any]:\n    \"\
          \"\"Return exact invalid JSON paths instead of silently accepting bad evidence.\"\
          \"\"\n\n    try:\n        dossier = dossier_json if isinstance(dossier_json,\
          \ dict) else json.loads(dossier_json)\n    except (TypeError, json.JSONDecodeError):\n\
          \        return {\n            \"validated_json\": \"\",\n            \"\
          markdown_summary\": \"\",\n            \"invalid_paths\": [\"$\"],\n   \
          \         \"can_continue\": False,\n        }\n    if not isinstance(dossier,\
          \ dict):\n        return {\n            \"validated_json\": \"\",\n    \
          \        \"markdown_summary\": \"\",\n            \"invalid_paths\": [\"\
          $\"],\n            \"can_continue\": False,\n        }\n\n    if isinstance(page_count,\
          \ str) and page_count.lstrip().startswith(\"{\"):\n        try:\n      \
          \      page_count = json.loads(page_count).get(\"page_count\", 0)\n    \
          \    except (AttributeError, json.JSONDecodeError):\n            page_count\
          \ = 0\n    try:\n        maximum_page = int(page_count)\n    except (TypeError,\
          \ ValueError):\n        maximum_page = 0\n\n    invalid_paths: list[str]\
          \ = []\n    for collection_name in (\"datasets\", \"methods\", \"metrics\"\
          ):\n        collection = dossier.get(collection_name, [])\n        if not\
          \ isinstance(collection, list):\n            invalid_paths.append(f\"$.{collection_name}\"\
