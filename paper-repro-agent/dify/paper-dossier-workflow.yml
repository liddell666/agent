    - data:
        code: "\"\"\"Validate the HTTP parser response before sending it to an LLM.\"\
          \"\"\n\nimport json\nfrom typing import Any\n\nMAX_RESPONSE_BYTES = 2 *\
          \ 1024 * 1024\n\nHTTP_ERRORS = {\n    401: \"解析器鉴权失败（HTTP 401），请检查工作流的 PARSER_API_TOKEN。\"\
          ,\n    413: \"论文文件过大（HTTP 413），请上传不超过 50 MB 的 PDF。\",\n    422: \"PDF 无法解析（HTTP\
          \ 422），请确认文件完整且未加密。\",\n    500: \"解析器内部错误（HTTP 500），请查看 paper-parser 日志。\"\
          ,\n}\n\n\ndef _failure(message: str) -> dict[str, Any]:\n    return {\n\
          \        \"parsed_json\": \"\",\n        \"parser_warnings\": [message],\n\
          \        \"can_continue\": False,\n    }\n\n\ndef main(body: str, status_code:\
          \ int = 200) -> dict[str, Any]:\n    \"\"\"Return Dify-compatible validation\
          \ outputs without raising user errors.\"\"\"\n\n    try:\n        status\
          \ = int(status_code)\n    except (TypeError, ValueError):\n        return\
          \ _failure(\"解析器返回了无效的 HTTP 状态码。\")\n\n    if status in HTTP_ERRORS:\n \
          \       return _failure(HTTP_ERRORS[status])\n    if status < 200 or status\
          \ >= 300:\n        return _failure(f\"解析器请求失败（HTTP {status}）。\")\n    if\
          \ not isinstance(body, str):\n        return _failure(\"解析器响应 body 不是文本。\"\
          )\n    if len(body.encode(\"utf-8\")) > MAX_RESPONSE_BYTES:\n        return\
          \ _failure(\"解析器 JSON 超过 2 MB，已停止发送给模型。\")\n\n    try:\n        payload\
          \ = json.loads(body)\n    except json.JSONDecodeError:\n        return _failure(\"\
          解析器响应不是有效 JSON。\")\n    if not isinstance(payload, dict):\n        return\
          \ _failure(\"解析器 JSON 顶层必须是对象。\")\n\n    page_count = payload.get(\"page_count\"\
          )\n    if not isinstance(page_count, int) or isinstance(page_count, bool)\
          \ or page_count < 1:\n        return _failure(\"解析器 JSON 的 page_count 缺失或无效。\"\
          )\n\n    markdown = payload.get(\"markdown\")\n    if not isinstance(markdown,\
          \ str) or not markdown.strip():\n        return _failure(\"解析器 JSON 的 markdown\
          \ 缺失或为空。\")\n\n    elements = payload.get(\"elements\")\n    if not isinstance(elements,\
          \ list) or not elements:\n        return _failure(\"解析器 JSON 的 elements\
          \ 缺失或为空。\")\n\n    warnings = payload.get(\"warnings\", [])\n    if not\
          \ isinstance(warnings, list):\n        warnings = [\"解析器 warnings 字段格式无效，已忽略。\"\
          ]\n    else:\n        warnings = [str(item) for item in warnings]\n\n  \
          \  return {\n        \"parsed_json\": json.dumps(payload, ensure_ascii=False,\
          \ separators=(\",\", \":\")),\n        \"parser_warnings\": warnings,\n\
          \        \"can_continue\": True,\n    }\n"
        code_language: python3
