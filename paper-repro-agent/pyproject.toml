[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-repro-agent"
version = "0.1.0"
description = "Evidence-preserving paper parsing service for Dify"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "pypdf==6.14.2",
]

[project.optional-dependencies]
parse = [
  "docling==2.117.0",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]
acceptance = [
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pyyaml==6.0.3",
  "xlrd==2.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp", "--import-mode=importlib"]
